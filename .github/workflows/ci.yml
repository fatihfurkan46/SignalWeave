name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile the package
        run: python -m compileall signalweave
      - name: Run the report pipeline
        run: python -m signalweave report examples/events.jsonl
      - name: Aggregate the JSON-array fixture
        run: python -m signalweave aggregate examples/events_array.json

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the native core
        run: c++ -std=c++17 -O2 -Wall -o engine/signal_aggregate engine/signal_aggregate.cpp
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python and native cores agree
        run: python -m signalweave normalize examples/events.jsonl | ./engine/signal_aggregate
